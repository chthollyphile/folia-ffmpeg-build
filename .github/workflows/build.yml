name: Build Folia FFmpeg

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
      FFMPEG_VARIANT: folia
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y nasm ffmpeg
      - name: Install ARM64 compiler
        if: env.ARCH == 'arm64'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: ./build-linux.sh
      - name: Verify native Folia build
        if: env.ARCH == 'x86_64'
        run: ./verify-folia.sh "$(find artifacts -path '*/bin/ffmpeg' -type f)" "$(command -v ffmpeg)"
      - name: Archive production artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-linux-${{ env.ARCH }}-folia
          path: artifacts/

  package-windows:
    runs-on: ubuntu-22.04
    env:
      ARCH: x86_64
      FFMPEG_VARIANT: folia
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y nasm mingw-w64
      - name: Build
        run: ./build-windows.sh
      - name: Archive production artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-windows-x86_64-folia
          path: artifacts/

  package-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-macos10.9
          - arm64-apple-macos11
    env:
      TARGET: ${{ matrix.target }}
      FFMPEG_VARIANT: folia
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install nasm
      - name: Build
        run: ./build-macos.sh
      - name: Verify native Folia build
        if: matrix.target == 'arm64-apple-macos11' && runner.arch == 'ARM64'
        run: ./verify-folia.sh "$(find artifacts -path '*/bin/ffmpeg' -type f)"
      - name: Archive production artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-${{ matrix.target }}-folia
          path: artifacts/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [package-linux, package-windows, package-macos]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: artifacts/
      - name: Add corresponding FFmpeg source
        run: |
          source common.sh
          download_verified "$FFMPEG_TARBALL_URL" "$FFMPEG_TARBALL" "$FFMPEG_TARBALL_SHA256"
          mkdir -p artifacts/release
          cp "$FFMPEG_TARBALL" artifacts/release/
      - name: Make release archives and checksums
        run: |
          mkdir -p artifacts/release
          cd artifacts
          for dir in ffmpeg-*/ffmpeg-*
          do
            name=$(basename "$dir")
            tar czf "release/$name.tar.gz" -C "$(dirname "$dir")" "$name"
          done
          cd release
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/*.tar.gz
            artifacts/release/SHA256SUMS
