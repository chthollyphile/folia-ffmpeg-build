name: Build Folia FFmpeg

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
      FFMPEG_VARIANT: folia
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y nasm ffmpeg
      - name: Install ARM64 compiler
        if: env.ARCH == 'arm64'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: ./build-linux.sh
      - name: Verify native Folia build
        if: env.ARCH == 'x86_64'
        run: ./verify-folia.sh "$(find artifacts -path '*/bin/ffmpeg' -type f)" "$(command -v ffmpeg)"
      - name: Archive production artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-linux-${{ env.ARCH }}-folia
          path: artifacts/

  package-windows:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      ARCH: ${{ matrix.arch }}
      FFMPEG_VARIANT: folia
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y nasm mingw-w64
      - name: Install LLVM-MinGW for Windows ARM64
        if: matrix.arch == 'aarch64'
        env:
          LLVM_MINGW_VERSION: '20261006'
          LLVM_MINGW_SHA256: 5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4
        run: |
          archive="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl --fail --location --retry 3 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "${LLVM_MINGW_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/llvm-mingw"
          tar -xJf "${RUNNER_TEMP}/${archive}" --strip-components=1 -C "${RUNNER_TEMP}/llvm-mingw"
          echo "${RUNNER_TEMP}/llvm-mingw/bin" >> "$GITHUB_PATH"
      - name: Build
        run: ./build-windows.sh
      - name: Verify Windows binary architecture and static runtime
        run: |
          binary="$(find artifacts -path '*/bin/ffmpeg.exe' -type f)"
          python3 - "$binary" "$ARCH" <<'PY'
          import struct
          import sys
          from pathlib import Path

          binary = Path(sys.argv[1]).read_bytes()
          offset = struct.unpack_from('<I', binary, 0x3c)[0]
          assert binary[:2] == b'MZ' and binary[offset:offset + 4] == b'PE\0\0'
          machine = struct.unpack_from('<H', binary, offset + 4)[0]
          assert machine == {'x86_64': 0x8664, 'aarch64': 0xaa64}[sys.argv[2]]
          PY
          imports="$("${ARCH}-w64-mingw32-objdump" -p "$binary" | awk '/DLL Name:/ {print $3}')"
          echo "$imports"
          if grep -Eiq '^(libunwind|libwinpthread|libgcc|libstdc\+\+|libc\+\+)' <<<"$imports"; then
            echo 'Windows runtime must not depend on toolchain DLLs' >&2
            exit 1
          fi
      - name: Archive production artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-windows-${{ matrix.arch }}-folia
          path: artifacts/

  verify-windows-arm64:
    runs-on: windows-11-arm
    needs: package-windows
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: ffmpeg-windows-aarch64-folia
          path: artifacts/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify native Folia build
        shell: bash
        env:
          PYTHON: python
        run: ./verify-folia.sh "$(find artifacts -path '*/bin/ffmpeg.exe' -type f)"

  package-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-macos10.9
          - arm64-apple-macos11
    env:
      TARGET: ${{ matrix.target }}
      FFMPEG_VARIANT: folia
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install nasm
      - name: Build
        run: ./build-macos.sh
      - name: Verify native Folia build
        if: matrix.target == 'arm64-apple-macos11' && runner.arch == 'ARM64'
        run: ./verify-folia.sh "$(find artifacts -path '*/bin/ffmpeg' -type f)"
      - name: Archive production artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-${{ matrix.target }}-folia
          path: artifacts/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [package-linux, package-windows, verify-windows-arm64, package-macos]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: artifacts/
      - name: Add corresponding FFmpeg source
        run: |
          source common.sh
          download_verified "$FFMPEG_TARBALL_URL" "$FFMPEG_TARBALL" "$FFMPEG_TARBALL_SHA256"
          mkdir -p artifacts/release
          cp "$FFMPEG_TARBALL" artifacts/release/
      - name: Make release archives and checksums
        run: |
          mkdir -p artifacts/release
          cd artifacts
          for dir in ffmpeg-*/ffmpeg-*
          do
            name=$(basename "$dir")
            tar czf "release/$name.tar.gz" -C "$(dirname "$dir")" "$name"
          done
          cd release
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/*.tar.gz
            artifacts/release/SHA256SUMS
